name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: bash scripts/audit-release.sh
      - run: pnpm pack --pack-destination "${RUNNER_TEMP}/dsh-package"
